<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Salimkhan — Frontend Developer</title>
  <desc id="desc">A black banner with gold accents, clear typography, and subtle animated highlights on the right.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0B0D"/>
      <stop offset="1" stop-color="#1B1B1F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8C16A"/>
      <stop offset="1" stop-color="#B9822B"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#FFFFFF" stroke-opacity=".04" stroke-width="1"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="300" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <path d="M930 0H1200V300H1080L960 180L1040 100Z" fill="#E3B85C" opacity=".16"/>
    <path d="M1080 0H1200V300H1160L1035 168Z" fill="url(#gold)" opacity=".96"/>
    <path d="M1140 0H1200V300H1180L1050 155Z" fill="#101010" opacity=".84"/>
    <path d="M900 0L1120 300" stroke="#E8C16A" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0.32;0" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M920 0L1140 300" stroke="#E8C16A" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;0;0.26;0" dur="5s" repeatCount="indefinite"/>
    </path>
    <circle cx="82" cy="74" r="4" fill="#E3B85C"/>
    <text x="82" y="145" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" letter-spacing="3">SALIMKHAN</text>
    <text x="86" y="190" fill="#E3B85C" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="5">FRONTEND DEVELOPER</text>
    <text x="86" y="230" fill="#B8B8B8" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing=".6">Building interfaces. Turning ideas into reality.</text>
    <text x="86" y="252" fill="#DADADA" font-family="monospace" font-size="13" letter-spacing="1.6">REACT  /  TYPESCRIPT  /  JAVASCRIPT</text>
    <text x="86" y="276" fill="#E8C16A" font-family="monospace" font-size="13" letter-spacing="1.6">PYTHON  /  DJANGO  /  MYSQL  /  SQLITE</text>
  </g>
</svg>