<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Salimkhan — Frontend Developer</title>
  <desc id="desc">A black and charcoal banner with large white typography and a softly moving orange light accent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0B0D"/>
      <stop offset="1" stop-color="#1B1B1F"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A24" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FF7A24" stop-opacity=".22"/>
      <stop offset="1" stop-color="#FF7A24" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#FFFFFF" stroke-opacity=".04" stroke-width="1"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="300" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <g>
      <path d="M0 0H230L540 300H310Z" fill="url(#beam)">
        <animateTransform attributeName="transform" type="translate" values="-650 0; 1250 0; -650 0" dur="12s" repeatCount="indefinite"/>
      </path>
    </g>
    <path d="M930 0H1200V300H1080L960 180L1040 100Z" fill="#FF7A24" opacity=".10"/>
    <path d="M1080 0H1200V300H1160L1035 168Z" fill="#FF7A24" opacity=".86"/>
    <path d="M1140 0H1200V300H1180L1050 155Z" fill="#101010" opacity=".84"/>
    <path d="M0 270H690" stroke="#FF7A24" stroke-width="3"/>
    <circle cx="82" cy="74" r="4" fill="#FF7A24"/>
    <text x="82" y="145" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" letter-spacing="3">SALIMKHAN</text>
    <text x="86" y="190" fill="#FF8A3D" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="5">FRONTEND DEVELOPER</text>
    <text x="86" y="230" fill="#B8B8B8" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing=".6">Building interfaces. Turning ideas into reality.</text>
    <text x="86" y="272" fill="#777777" font-family="monospace" font-size="12" letter-spacing="2">REACT  /  TYPESCRIPT  /  JAVASCRIPT</text>
  </g>
</svg>